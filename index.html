<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#29251f">
  <meta name="description" content="Thoughtful woodworking and handcrafted pieces made to last.">
  <title>Fowler's WoodCraft</title>
  <link rel="icon" href="favicon.png" type="image/png" sizes="16x16">
  <link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
  <link rel="shortcut icon" href="favicon.ico">
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main>
    <section class="hero" id="home">
      <div class="wrap hero-content">
        <div class="hero-title">
          <h1>Fowler's WoodCraft<br><em>Artisanal Canadian WoodCraft</em></h1>
          <p class="eyebrow">Built slowly by hand, one at a time</p>
          <p class="hero-lede">Heirloom Boxes for Jewelry, Collectibles, Curios and Gaming.</p>
        </div>
      </div>
    </section>

    <section class="section" id="gallery" aria-label="Photo gallery">
      <div class="wrap">
        <div class="gallery-grid">
          <article class="card"><button class="card-btn" type="button" aria-label="View photo larger"><img src="img/IMG_0009.jpeg" alt="Long gray-stained wooden box with two brass latches" loading="lazy"></button></article>
          <article class="card"><button class="card-btn" type="button" aria-label="View photo larger"><img src="img/IMG_0034.jpeg" alt="Stack of raw hardwood boards showing walnut and striped grain" loading="lazy"></button></article>
          <article class="card"><button class="card-btn" type="button" aria-label="View photo larger"><img src="img/IMG_0055.jpeg" alt="Light wood jewelry box with a dark inlaid lid, carved detail and two drawers" loading="lazy"></button></article>
          <article class="card"><button class="card-btn" type="button" aria-label="View photo larger"><img src="img/IMG_0058.jpeg" alt="Open jewelry box with black velvet-lined trays and a small wooden box inside" loading="lazy"></button></article>
          <article class="card"><button class="card-btn" type="button" aria-label="View photo larger"><img src="img/IMG_0474.JPG" alt="Open wooden box with a brass clasp and figured grain" loading="lazy"></button></article>
          <article class="card"><button class="card-btn" type="button" aria-label="View photo larger"><img src="img/IMG_0504.JPG" alt="Small wooden chest of drawers with brass pulls, one drawer open and holding dice" loading="lazy"></button></article>
          <article class="card"><button class="card-btn" type="button" aria-label="View photo larger"><img src="img/IMG_0692.JPG" alt="Close-up of a striped hardwood box corner resting on a brass ball foot" loading="lazy"></button></article>
          <article class="card"><button class="card-btn" type="button" aria-label="View photo larger"><img src="img/IMG_0698.JPG" alt="Open striped hardwood box with a light wood interior and a center divider" loading="lazy"></button></article>
          <article class="card"><button class="card-btn" type="button" aria-label="View photo larger"><img src="img/IMG_0869.jpeg" alt="Open wooden box with a dark walnut lid, holding a bottle" loading="lazy"></button></article>
          <article class="card"><button class="card-btn" type="button" aria-label="View photo larger"><img src="img/humidor1.jpg" alt="Wooden box with a pale maple lid, reddish side grain and an ornate brass clasp" loading="lazy"></button></article>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap footer-inner">
      <div class="footer-brand">
        <img src="img/logo.svg" width="30" height="30" alt="">
        <span>&copy; <span id="year"></span> Fowler's WoodCraft</span>
      </div>
      <span>Custom pieces made to order.</span>
    </div>
  </footer>

  <dialog class="lightbox" id="lightbox" aria-label="Photo viewer">
    <button class="lb-close" type="button" aria-label="Close">&times;</button>
    <button class="lb-nav lb-prev" type="button" aria-label="Previous photo">&#8249;</button>
    <img class="lb-img" alt="">
    <button class="lb-nav lb-next" type="button" aria-label="Next photo">&#8250;</button>
    <p class="lb-count" aria-live="polite"></p>
  </dialog>
</body>
</html>

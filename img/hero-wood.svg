<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1900 700" preserveAspectRatio="xMidYMid slice">
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.0035 0.09" numOctaves="4" seed="7" result="n"/>
      <feColorMatrix in="n" type="matrix"
        values="0 0 0 0 0.35  0 0 0 0 0.20  0 0 0 0 0.09  0.9 0.9 0.9 0 -0.55"/>
    </filter>
    <filter id="fine" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.01 0.35" numOctaves="2" seed="21"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.10  0 0 0 0 0.06  0 0 0 0 0.03  0 0 0 0.9 -0.35"/>
    </filter>
    <linearGradient id="tone" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a5429"/>
      <stop offset=".5" stop-color="#a96635"/>
      <stop offset="1" stop-color="#7a4a25"/>
    </linearGradient>
  </defs>
  <rect width="1900" height="700" fill="url(#tone)"/>
  <rect width="1900" height="700" filter="url(#grain)"/>
  <rect width="1900" height="700" filter="url(#fine)" opacity=".6"/>
</svg>
